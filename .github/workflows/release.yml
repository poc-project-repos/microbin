name: "Release Packages & Images"

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v2.1.4)'
        required: true
        type: string
        default: 'v2.1.4'
      is_prerelease:
        description: 'Mark as Pre-release'
        required: false
        type: boolean
        default: false
      publish_docker:
        description: 'Publish multi-arch image to Docker Hub'
        required: false
        type: boolean
        default: false

jobs:
  release:
    name: Publish to GitHub Releases
    runs-on: ${{ matrix.os }}
    outputs:
      rc: ${{ steps.check-tag.outputs.rc }}
      version: ${{ steps.check-tag.outputs.version }}

    strategy:
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            use-cross: true
            cargo-flags: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            use-cross: true
            cargo-flags: ""
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            use-cross: true
            cargo-flags: "--no-default-features --features no-c-deps"
          - target: x86_64-apple-darwin
            os: macos-latest
            cargo-flags: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cargo-flags: ""
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use-cross: true
            cargo-flags: ""
          - target: i686-unknown-linux-musl
            os: ubuntu-latest
            use-cross: true
            cargo-flags: ""
          - target: i686-pc-windows-msvc
            os: windows-latest
            use-cross: true
            cargo-flags: ""
          - target: armv7-unknown-linux-musleabihf
            os: ubuntu-latest
            use-cross: true
            cargo-flags: ""
          - target: arm-unknown-linux-musleabihf
            os: ubuntu-latest
            use-cross: true
            cargo-flags: ""

    steps:
      - name: Checkout Source
        uses: actions/checkout@v5

      - name: Parse Release Version
        id: check-tag
        shell: bash
        run: |
          tag="${{ github.event.inputs.tag_name || github.ref_name }}"
          echo "version=$tag" >> $GITHUB_OUTPUT
          
          if [[ "${{ github.event.inputs.is_prerelease }}" == "true" ]] || [[ ! "$tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "rc=true" >> $GITHUB_OUTPUT
          else
            echo "rc=false" >> $GITHUB_OUTPUT
          fi

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Synchronize Cargo.toml Version
        shell: bash
        run: |
          raw_version="${{ steps.check-tag.outputs.version }}"
          semver="${raw_version#v}"
          echo "Automated sync: Setting Cargo.toml version to $semver"
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            sed -i '' 's/^version = ".*"/version = "'"$semver"'"/' Cargo.toml
          else
            sed -i 's/^version = ".*"/version = "'"$semver"'"/' Cargo.toml
          fi

      - name: Install OpenSSL
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Install Cross
        if: matrix.use-cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Binary
        shell: bash
        run: |
          if [ "${{ matrix.use-cross }}" = "true" ]; then
            cross build --locked --release --target=${{ matrix.target }} ${{ matrix.cargo-flags }}
          else
            cargo build --locked --release --target=${{ matrix.target }} ${{ matrix.cargo-flags }}
          fi

      - name: Package Binary Archive
        shell: bash
        id: package
        env:
          target: ${{ matrix.target }}
          version: ${{ steps.check-tag.outputs.version }}
        run: |
          set -euxo pipefail

          bin=${GITHUB_REPOSITORY##*/}
          dist="$(pwd)/dist"
          name="$bin-$version-$target"
          executable="target/$target/release/$bin"

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            executable="$executable.exe"
          fi

          mkdir -p "$dist"
          cp "$executable" "$dist/"
          cd "$dist"

          if [[ "$RUNNER_OS" == "Windows" ]]; then
            archive="$dist/$name.zip"
            7z a "$archive" *
            echo "archive=`pwd -W`/$name.zip" >> $GITHUB_OUTPUT
          else
            archive="$dist/$name.tar.gz"
            tar czf "$archive" *
            echo "archive=$archive" >> $GITHUB_OUTPUT
          fi

      - name: Publish Release Asset to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check-tag.outputs.version }}
          files: ${{ steps.package.outputs.archive }}
          prerelease: ${{ steps.check-tag.outputs.rc == 'true' }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Publish to Docker Hub
    if: ${{ github.event.inputs.publish_docker == 'true' || github.event.inputs.publish_docker == true }}
    runs-on: ubuntu-latest
    needs: release
    steps:
      - name: Checkout Source
        uses: actions/checkout@v5

      - name: Docker Meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_REPO }}
          flavor: |
            latest=auto
          tags: |
            type=raw,value=${{ github.event.inputs.tag_name }}
            type=raw,value=latest

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Multi-Arch Image
        if: env.DOCKERHUB_USERNAME != ''
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: |
            linux/amd64
            linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
