name: "CD: Deploy to GCP Always-Free"

on:
  push:
    branches:
      - main
      - 'release/v*'
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Environment'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - preview
          - release
      gcp_region:
        description: 'GCP Always-Free Region'
        required: true
        default: 'us-east1'
        type: choice
        options:
          - us-east1
          - us-central1
          - us-west1
      gcp_zone:
        description: 'GCP Always-Free Zone'
        required: true
        default: 'us-east1-b'
        type: choice
        options:
          - us-east1-b
          - us-east1-c
          - us-east1-d
          - us-central1-a
          - us-central1-b
          - us-central1-c
          - us-central1-f
          - us-west1-a
          - us-west1-b
          - us-west1-c

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ github.event.inputs.gcp_region || 'us-east1' }}
  GCP_ZONE: ${{ github.event.inputs.gcp_zone || 'us-east1-b' }}
  GAR_REPOSITORY: microbin-repo
  IMAGE_NAME: microbin
  VM_NAME: microbin-free-tier
  DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
  CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}

jobs:
  build-and-deploy:
    name: Build, Publish & Deploy (Cloudflare Tunnel)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Determine Deployment Slot
        id: slot
        run: |
          choice="${{ github.event.inputs.target_env || 'auto' }}"
          ref="${{ github.ref }}"
          
          if [ "$choice" = "release" ] || ([ "$choice" = "auto" ] && [[ "$ref" == refs/heads/release/v* ]]); then
            echo "TARGET_SLOT=release" >> $GITHUB_ENV
            echo "TARGET_SERVICE=microbin-release" >> $GITHUB_ENV
            echo "TARGET_DOMAIN=bin-release.${{ env.DOMAIN_NAME }}" >> $GITHUB_ENV
          else
            echo "TARGET_SLOT=preview" >> $GITHUB_ENV
            echo "TARGET_SERVICE=microbin-preview" >> $GITHUB_ENV
            echo "TARGET_DOMAIN=bin-preview.${{ env.DOMAIN_NAME }}" >> $GITHUB_ENV
          fi

      - name: Google Cloud Authentication (OIDC / Keyless WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Google Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set Image Tag
        id: image-tag
        run: |
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV
          echo "TAG_SHA=${IMAGE_URI}:${{ github.sha }}" >> $GITHUB_ENV
          echo "TAG_LATEST=${IMAGE_URI}:${{ env.TARGET_SLOT }}-latest" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push MicroBin Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.TAG_SHA }}
            ${{ env.TAG_LATEST }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to GCE VM via gcloud SSH
        run: |
          echo "Deploying ${{ env.TARGET_SLOT }} slot to VM ${{ env.VM_NAME }} in zone ${{ env.GCP_ZONE }}..."
          
          # Create remote application directory
          gcloud compute ssh ${{ env.VM_NAME }} \
            --zone=${{ env.GCP_ZONE }} \
            --project=${{ env.PROJECT_ID }} \
            --command="sudo mkdir -p /opt/microbin"

          # Copy docker-compose.prod.yml to VM
          gcloud compute scp deploy/gcp/docker-compose.prod.yml \
            ${{ env.VM_NAME }}:/tmp/ \
            --zone=${{ env.GCP_ZONE }} \
            --project=${{ env.PROJECT_ID }}

          # Move compose config and update slot environment variables
          gcloud compute ssh ${{ env.VM_NAME }} \
            --zone=${{ env.GCP_ZONE }} \
            --project=${{ env.PROJECT_ID }} \
            --command="sudo mv /tmp/docker-compose.prod.yml /opt/microbin/ && \
              sudo touch /opt/microbin/.env && \
              sudo sed -i '/^DOMAIN_RELEASE=/d' /opt/microbin/.env && \
              sudo sed -i '/^DOMAIN_PREVIEW=/d' /opt/microbin/.env && \
              sudo sed -i '/^CLOUDFLARE_TUNNEL_TOKEN=/d' /opt/microbin/.env && \
              echo 'DOMAIN_RELEASE=bin-release.${{ env.DOMAIN_NAME }}' | sudo tee -a /opt/microbin/.env && \
              echo 'DOMAIN_PREVIEW=bin-preview.${{ env.DOMAIN_NAME }}' | sudo tee -a /opt/microbin/.env && \
              echo 'CLOUDFLARE_TUNNEL_TOKEN=${{ env.CLOUDFLARE_TUNNEL_TOKEN }}' | sudo tee -a /opt/microbin/.env && \
              if [ '${{ env.TARGET_SLOT }}' = 'release' ]; then \
                sudo sed -i '/^MICROBIN_RELEASE_IMAGE=/d' /opt/microbin/.env && \
                echo 'MICROBIN_RELEASE_IMAGE=${{ env.TAG_SHA }}' | sudo tee -a /opt/microbin/.env; \
              else \
                sudo sed -i '/^MICROBIN_PREVIEW_IMAGE=/d' /opt/microbin/.env && \
                echo 'MICROBIN_PREVIEW_IMAGE=${{ env.TAG_SHA }}' | sudo tee -a /opt/microbin/.env; \
              fi"

          # Configure Artifact Registry credentials on the VM and start stack
          gcloud compute ssh ${{ env.VM_NAME }} \
            --zone=${{ env.GCP_ZONE }} \
            --project=${{ env.PROJECT_ID }} \
            --command="cd /opt/microbin && \
              sudo gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet && \
              sudo docker compose -f docker-compose.prod.yml pull && \
              sudo docker compose -f docker-compose.prod.yml up -d --remove-orphans"

          echo "Deployment completed successfully! Live URL: https://${{ env.TARGET_DOMAIN }}"
