name: "CD: Deploy to GCP Always-Free"

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      gcp_region:
        description: 'GCP Always-Free Region'
        required: true
        default: 'us-central1'
        type: choice
        options:
          - us-central1
          - us-east1
          - us-west1
      gcp_zone:
        description: 'GCP Always-Free Zone'
        required: true
        default: 'us-central1-a'
        type: choice
        options:
          - us-central1-a
          - us-central1-b
          - us-central1-c
          - us-central1-f
          - us-east1-b
          - us-east1-c
          - us-east1-d
          - us-west1-a
          - us-west1-b
          - us-west1-c

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ github.event.inputs.gcp_region || 'us-central1' }}
  GCP_ZONE: ${{ github.event.inputs.gcp_zone || 'us-central1-a' }}
  GAR_REPOSITORY: microbin-repo
  IMAGE_NAME: microbin
  VM_NAME: microbin-free-tier
  DOMAIN_NAME: ${{ secrets.DOMAIN_NAME }}
  ACME_EMAIL: ${{ secrets.ACME_EMAIL }}

jobs:
  build-and-deploy:
    name: Build, Publish & Deploy (MicroBin + Caddy TLS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Google Cloud Authentication (OIDC / Keyless WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Google Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Set Image Tag
        id: image-tag
        run: |
          IMAGE_URI="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}"
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV
          echo "TAG_SHA=${IMAGE_URI}:${{ github.sha }}" >> $GITHUB_ENV
          echo "TAG_LATEST=${IMAGE_URI}:latest" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push MicroBin Container
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.TAG_SHA }}
            ${{ env.TAG_LATEST }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Generate Production Environment File
        run: |
          echo "MICROBIN_IMAGE=${{ env.TAG_SHA }}" > /tmp/microbin.env
          echo "DOMAIN_NAME=${{ env.DOMAIN_NAME }}" >> /tmp/microbin.env
          echo "ACME_EMAIL=${{ env.ACME_EMAIL }}" >> /tmp/microbin.env

      - name: Deploy to GCE VM via gcloud SSH
        run: |
          echo "Connecting to VM ${{ env.VM_NAME }} in zone ${{ env.GCP_ZONE }}..."
          
          # Create remote application directory
          gcloud compute ssh ${{ env.VM_NAME }} \
            --zone=${{ env.GCP_ZONE }} \
            --project=${{ env.PROJECT_ID }} \
            --command="sudo mkdir -p /opt/microbin"

          # Copy Caddyfile, docker-compose.prod.yml, and environment config to VM
          gcloud compute scp deploy/gcp/Caddyfile deploy/gcp/docker-compose.prod.yml /tmp/microbin.env \
            ${{ env.VM_NAME }}:/tmp/ \
            --zone=${{ env.GCP_ZONE }} \
            --project=${{ env.PROJECT_ID }}

          # Move files into /opt/microbin/
          gcloud compute ssh ${{ env.VM_NAME }} \
            --zone=${{ env.GCP_ZONE }} \
            --project=${{ env.PROJECT_ID }} \
            --command="sudo mv /tmp/Caddyfile /tmp/docker-compose.prod.yml /opt/microbin/ && sudo mv /tmp/microbin.env /opt/microbin/.env"

          # Configure Artifact Registry credentials on the VM and start stack
          gcloud compute ssh ${{ env.VM_NAME }} \
            --zone=${{ env.GCP_ZONE }} \
            --project=${{ env.PROJECT_ID }} \
            --command="cd /opt/microbin && \
              sudo gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet && \
              sudo docker compose -f docker-compose.prod.yml pull && \
              sudo docker compose -f docker-compose.prod.yml up -d --remove-orphans"

          echo "Deployment completed successfully! Caddy is managing Let's Encrypt TLS for ${{ env.DOMAIN_NAME }}."
